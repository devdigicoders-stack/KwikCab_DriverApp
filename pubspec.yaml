name: kwikcabdriver
description: "KwikCab Driver App"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  pinput: ^5.0.0
  shared_preferences: ^2.3.3
  geolocator: ^14.0.2
  intl: ^0.19.0
  lottie: ^3.3.3
  google_fonts: ^8.1.0
  http: ^1.6.0
  image_picker: ^1.2.2
  google_maps_flutter: ^2.17.1
  flutter_polyline_points: ^3.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.1.2
  socket_io_client: ^3.1.6
  audioplayers: ^6.7.1
  location: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo2.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo2.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
